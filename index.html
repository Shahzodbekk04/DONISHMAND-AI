            { id: 'imperator', nom: 'Imperator uslubi', belgi: '👑', tavsif: 'Zahiriddin Muhammad Bobur kabi chuqur, samimiy, olijanob va shaxsiy kechinmalarga boy.' },

            { id: 'qattiq', nom: '🔥 Juda qattiq', rang: 'border-red-500/40 text-red-400 bg-red-500/5' },
            { id: 'motivatsion', nom: '💪 Motivatsion', rang: 'border-blue-500/40 text-blue-400 bg-blue-500/5' },
            { id: 'aqlli', nom: '🤓 Aqlli', rang: 'border-purple-500/40 text-purple-400 bg-purple-500/5' },

            { id: 'donolik', nom: '🧠 Donolik' },
            { id: 'teatr', nom: '🎭 Teatr uslubi' },
            { id: 'kino', nom: '🎬 Kino uslubi' },
            { id: 'qadimiy', nom: '📜 Qadimiy uslub' }
        ];

        function DustParticles() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resizeCanvas = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                const particles = [];
                const particleCount = 45;

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2 + 0.5,
                        speedX: Math.random() * 0.4 - 0.2,
                        speedY: Math.random() * 0.3 - 0.5, 
                        alpha: Math.random() * 0.6 + 0.1
                    });
                }

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach((p) => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(245, 158, 11, ${p.alpha})`; 
                        ctx.fill();

                        p.x += p.speedX;
                        p.y += p.speedY;

                        if (p.y < 0) {
                            p.y = canvas.height;
                            p.x = Math.random() * canvas.width;
                        }
                        if (p.x < 0 || p.x > canvas.width) {
                            p.x = Math.random() * canvas.width;
                        }
                    });
                    animationFrameId = requestAnimationFrame(draw);
                };

                draw();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', resizeCanvas);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-10" />;
        }

        function App() {
            const [boshlangan, setBoshlangan] = useState(false);
            const [kunDonoligi, setKunDonoligi] = useState(KUN_DONOLIKLARI[0]);
            const [tanlanganPersonaj, setTanlanganPersonaj] = useState(PERSONAJLAR[0]);
            const [tanlanganKayfiyat, setTanlanganKayfiyat] = useState(KAYFIYATLAR[3]);
            const [tanlanganRejim, setTanlanganRejim] = useState(REJIMLAR[3]);
            const [muammo, setMuammo] = useState('');
            
            const [yuklanmoqda, setYuklanmoqda] = useState(false);
            const [javob, setJavob] = useState('');
            const [jonliMatn, setJonliMatn] = useState('');
            const [baholar, setBaholar] = useState({ jasorat: 75, intizom: 60, rivojlanish: 80, ruhiyat: 65, umid: 70 });
            const [nusxalandi, setNusxalandi] = useState(false);
            const [xatoXabari, setXatoXabari] = useState('');

            const [ovozOynalmoqda, setOvozOynalmoqda] = useState(false);
            const [ovozTezligi, setOvozTezligi] = useState(1.0); 

            // API Sozlamalari oynasi
            const [showSettings, setShowSettings] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');
            const [apiKey, setApiKey] = useState('');

            useEffect(() => {
                const randomHikmat = KUN_DONOLIKLARI[Math.floor(Math.random() * KUN_DONOLIKLARI.length)];
                setKunDonoligi(randomHikmat);

                const storedKey = localStorage.getItem('donishmand_gemini_api_key') || '';
                setApiKey(storedKey);
                setTempApiKey(storedKey);
            }, []);

            useEffect(() => {
                if (!javob) return;
                setJonliMatn('');
                let i = 0;
                const interval = setInterval(() => {
                    if (i < javob.length) {
                        setJonliMatn((prev) => prev + javob.charAt(i));
                        i++;
                    } else {
                        clearInterval(interval);
                    }
                }, 12);
                return () => clearInterval(interval);
            }, [javob]);

            const saqlashAPIKey = () => {
                localStorage.setItem('donishmand_gemini_api_key', tempApiKey);
                setApiKey(tempApiKey);
                setShowSettings(false);
            };

            const simulateFallbackResponse = () => {
                let fallbackText = "";
                let mockBaholar = { jasorat: 80, intizom: 75, rivojlanish: 90, ruhiyat: 60, umid: 85 };

                if (tanlanganPersonaj.id === 'sohibqiron') {
                    fallbackText = `Sening g'aming va tushkunliging saltanatni boshqarish va g'alaba qozonish yo'lidagi to'siqlardan og'ir emas, do'stim! Yiqilgan kurashdan to'ymaydi, asosiysi qayta turib kurashishda. Qiyinchiliklar sening irodangni toblaydi. Men saltanatni bir kunda va osonlikcha qurmaganman. Telefonni chetga qo'y, belni mahkam bog'la va jangga kir! Jasorat sening eng katta qurolingdir!`;
                    mockBaholar = { jasorat: 95, intizom: 85, rivojlanish: 80, ruhiyat: 70, umid: 90 };
                } else if (tanlanganPersonaj.id === 'shoir') {
                    fallbackText = `Ey ko'ngli xira do'stim, g'am chekma bu dunyo o'tkinchidir. Ko'z yoshlaring duryodek oqmasin, chunki har tunning ortida yorug' subh bordir. Qiyinchilik she'riyati kelajak g'azalingga go'zallik va ta'sirchanlik bag'ishlaydi. Bir lahza tin ol, o'zingni kashf et, qalbingni yorit.`;
                    mockBaholar = { jasorat: 60, intizom: 70, rivojlanish: 85, ruhiyat: 90, umid: 95 };
                } else if (tanlanganPersonaj.id === 'olim') {
                    fallbackText = `Sening muammoingni tahlil qilsak, u dori bilan emas, fikr kuchi va tizimli tartib bilan davolanadigan ruxiy holatdir. Har qanday murakkab formula kabi, hayot tugunlari ham bosqichma-bosqich yechiladi. Vaqtni to'g'ri taqsimla, miyangni keraksiz xayollardan tozalab, ilmga yuzlan va yangi g'oyalarni sinab ko'r!`;
                    mockBaholar = { jasorat: 70, intizom: 95, rivojlanish: 95, ruhiyat: 75, umid: 80 };
                } else if (tanlanganPersonaj.id === 'imperator') {
                    fallbackText = `Sening qalbingdagi bu iztirob meni ham anduhga soldi. Lekin unutma, taqdir zarbalari insonni yanada buyuk qiladi. Vatandan uzoqda bo'lsam ham umidimni uzmadim, sen ham aslo taslim bo'lma. O'zingga ishon, olijanob maqsadlar sari dadil qadam tashla!`;
                    mockBaholar = { jasorat: 85, intizom: 80, rivojlanish: 88, ruhiyat: 70, umid: 85 };
                } else if (tanlanganPersonaj.id === 'ixtirochi') {
                    fallbackText = `Har qanday chalkash vaziyat - bu yechilishi lozim bo'lgan algebraik tenglamadir. Noma'lumlarni aniqla, xatolaringni tahlil qil va yangi tenglama tuz. Sening bugungi muvaffaqiyatsizliging kelgusi buyuk kashfiyotlar poydevoridir. Tizimli harakat qil va hisob-kitobda adashma.`;
                    mockBaholar = { jasorat: 75, intizom: 90, rivojlanish: 98, ruhiyat: 68, umid: 85 };
                } else if (tanlanganPersonaj.id === 'sayohatchi') {
                    fallbackText = `Men dunyo kezib shuni angladimki, eng buyuk sayohat va sarguzasht insonning o'z qiyinchiliklarini yengishidir. Bugungi yo'ling toshloq bo'lsa, ertaga u go'zal vodiylarga olib boradi. Yo'lda davom et, to'xtab qolish eng katta xatodir!`;
                    mockBaholar = { jasorat: 90, intizom: 70, rivojlanish: 85, ruhiyat: 80, umid: 90 };
                } else if (tanlanganPersonaj.id === 'faylasuf') {
                    fallbackText = `Fozil insonlar jamiyati va hayot qonuniyatlari shuni ko'rsatadiki, tushkunlik faqatgina vaqtinchalik illatdir. Fikrlaringni jilovla, ongni kengaytir va muammoni tepadan turib kuzat. Bu seni dono va kuchli qiladi. Kelajak seni kutmoqda.`;
                    mockBaholar = { jasorat: 78, intizom: 88, rivojlanish: 90, ruhiyat: 85, umid: 80 };
                } else {
                    fallbackText = `Ey aziz qalb egasi, yo'lingda uchragan bu toshlar sening parvozingni to'xtata olmaydi. Shamol qanchalik qattiq bo'lsa, varrak shunchalik baland ko'tariladi. Qiyinchiliklar faqat qanotlaringni mustahkamlash uchun berilgan. Qalbingni sevgi va umidga to'ldir!`;
                    mockBaholar = { jasorat: 80, intizom: 75, rivojlanish: 90, ruhiyat: 95, umid: 99 };
                }

                setJavob(fallbackText);
                setBaholar(mockBaholar);
            };

            const donishmanddanSora = async () => {
                if (!muammo.trim()) {
                    setXatoXabari("Iltimos, avval hayotingizdagi biror muammo yoki tushkun vaziyatni yozing!");
                    return;
                }
                setXatoXabari('');
                setYuklanmoqda(true);
                setJavob('');
                setJonliMatn('');

                if (!apiKey) {
                    setXatoXabari("Siz Gemini API kalitini kiritmagansiz. Loyiha hozircha oflayn rejimda ishlamoqda. To'liq AI javobini olish uchun tepadagi tishli g'ildirakchani bosing.");

                        simulateFallbackResponse();
                        setYuklanmoqda(false);
                    }, 1200);
                    return;

                const systemPrompt = `Siz "Donishmand AI" qadimiy siymolar qiyofasidagi maslahatchisiz. Foydalanuvchi muammosini tahlil qiling.
Javob faqat O'zbek tilida, nihoyatda chiroyli, premium, ta'sirli va chuqur badiiy bo'lishi shart.
Foydalanuvchi ma'lumotlari:
- Muammo: "${muammo}"
- Tanlangan personaj uslubi: "${tanlanganPersonaj.nom}" (${tanlanganPersonaj.tavsif})
- Kayfiyat: "${tanlanganKayfiyat.nom}"
- Qo'shimcha rejim: "${tanlanganRejim.nom}"

Javobni quyidagi JSON formatida qaytaring, boshqa hech qanday ortiqcha matn, so'z, tushuntirish yoki belgi yozmang:
{
  "javob": "Bu yerda sizning qadimiy uslubdagi dono, hazil aralash, qisman kinoyali, lekin oxirida juda katta motivatsiya beruvchi o'zbekcha javobingiz bo'ladi.",
  "jasorat": 10 dan 100 gacha son,
  "intizom": 10 dan 100 gacha son,
  "rivojlanish": 10 dan 100 gacha son,
  "ruhiyat": 10 dan 100 gacha son,
  "umid": 10 dan 100 gacha son
}`;

                const userQuery = `Foydalanuvchi muammosi: ${muammo}. Men ${tanlanganPersonaj.nom} uslubida, ${tanlanganKayfiyat.nom} kayfiyatda va ${tanlanganRejim.nom} rejimida yechim va maslahat istayman.`;

                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    javob: { type: "STRING" },
                                    jasorat: { type: "INTEGER" },
                                    intizom: { type: "INTEGER" },
                                    rivojlanish: { type: "INTEGER" },
                                    ruhiyat: { type: "INTEGER" },
                                    umid: { type: "INTEGER" }
                                },
                                required: ["javob", "jasorat", "intizom", "rivojlanish", "ruhiyat", "umid"]
                            }
                        },
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        throw new Error("API xato qaytardi (kalit xato bo'lishi mumkin).");
                    }

                    const result = await res.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const parsed = JSON.parse(candidate.content.parts[0].text);
                        setJavob(parsed.javob);
                        setBaholar({
                            jasorat: parsed.jasorat || 60,
                            intizom: parsed.intizom || 60,
                            rivojlanish: parsed.rivojlanish || 60,
                            ruhiyat: parsed.ruhiyat || 60,
                            umid: parsed.umid || 60
                        });
                    } else {
                        throw new Error("Bo'sh javob.");
                    }
                } catch (error) {
                    console.error("API Xatolik:", error);
                    setXatoXabari("API ulanishida xatolik yuz berdi. Oflayn simulyatsiyadan foydalanildi!");
                    simulateFallbackResponse();
                } finally {
                    setYuklanmoqda(false);
                }
            };

            const boshqarOvoz = (amal) => {
                if (!('speechSynthesis' in window)) {
                    setXatoXabari("Sizning brauzeringiz ovozli o'qishni qo'llab-quvvatlamaydi!");
                    return;
                }

                if (amal === 'tinglash') {
                    window.speechSynthesis.cancel();
                    const speech = new SpeechSynthesisUtterance(javob);
                    speech.lang = 'tr-TR'; 
                    speech.rate = ovozTezligi;
                    
                    speech.onend = () => {
                        setOvozOynalmoqda(false);
                    };
                    
                    window.speechSynthesis.speak(speech);
                    setOvozOynalmoqda(true);
                } else if (amal === 'toxtatish') {
                    window.speechSynthesis.pause();
                    setOvozOynalmoqda(false);
                } else if (amal === 'ochirish') {
                    window.speechSynthesis.cancel();
                    setOvozOynalmoqda(false);
                }
            };

            const nusxaOlish = () => {
                document.execCommand('copy');
                const text = `🏛 Donishmand AI Maslahati\n\nPersonaj: ${tanlanganPersonaj.nom}\nKayfiyat: ${tanlanganKayfiyat.nom}\n\n"${javob}"\n\n© Donishmand AI platformasi`;
                
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = text;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);

                setNusxalandi(true);
                setTimeout(() => setNusxalandi(false), 2000);
            };

            const yuklashPDF = () => {
                window.print();
            };

            return (
                <div className="relative z-20 min-h-screen flex flex-col justify-between">
                    
                    {/* Background bezaklari */}
                    <div className="absolute top-[-15%] left-[-10%] w-[500px] h-[500px] rounded-full bg-purple-900/10 blur-[120px] pointer-events-none -z-10" />
                    <div className="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-amber-950/15 blur-[150px] pointer-events-none -z-10" />
                    <DustParticles />

                    {/* Navigatsiya qismi */}
                    <header className="max-w-7xl mx-auto w-full px-4 py-6 flex justify-between items-center border-b border-amber-900/20">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl filter drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]">🏛</span>
                            <div>
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-600 bg-clip-text text-transparent tracking-wider">
                                    DONISHMAND AI
                                </h1>
                                <p className="text-[10px] text-amber-500/70 uppercase tracking-widest font-semibold">
                                    Buyuk siymolardan ilhomlangan dono maslahatlar
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-3">
                            {/* API sozlash tishli g'ildirakcha tugmasi */}
                            <button 
                                onClick={() => setShowSettings(true)}
                                className="p-2.5 rounded-full bg-stone-900/80 hover:bg-stone-850 border border-stone-800 hover:border-amber-500/30 transition-all text-stone-400 hover:text-amber-400 group"
                                title="API Kalit Sozlamalari"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 group-hover:rotate-45 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </header>

                    {/* API Sozlamalari oynasi (Modal) */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="w-full max-w-md p-6 rounded-2xl border border-amber-900/30 bg-[#0d0c15] shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-amber-400 flex items-center gap-2">
                                    <span>⚙️</span> GEMINI API KALITI SOZLAMALARI
                                </h3>
                                <p className="text-xs text-stone-400 leading-relaxed">
                                    Loyiha Gemini AI yordamida haqiqiy vaqt rejimida javob berishi uchun o'zingizning bepul API kalitingizni kiriting. Kalit faqat sizning brauzeringiz xotirasida saqlanadi.
                                </p>
                                <div className="space-y-2">
                                    <label className="text-[11px] font-bold text-stone-500 uppercase tracking-wider">API Kaliti</label>
                                    <input 
                                        type="password"
                                        value={tempApiKey}
                                        onChange={(e) => setTempApiKey(e.target.value)}
                                        placeholder="AIzaSy..."
                                        className="w-full p-3 bg-stone-950/80 border border-stone-800 rounded-xl focus:border-amber-500/50 focus:outline-none text-sm text-stone-200"
                                    />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={saqlashAPIKey}
                                        className="flex-1 py-2.5 bg-gradient-to-r from-amber-600 to-amber-500 rounded-xl text-black font-bold text-xs tracking-wider hover:opacity-90 transition-opacity"
                                    >
                                        SAQLASH
                                    </button>
                                    <button 
                                        onClick={() => setShowSettings(false)}
                                        className="px-4 py-2.5 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 text-xs hover:text-white transition-colors"
                                    >
                                        YOPISH
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Global ogohlantirish banneri */}
                    {xatoXabari && (
                        <div className="max-w-3xl mx-auto w-full mt-4 px-4">
                            <div className="p-4 bg-amber-950/40 border border-amber-500/20 rounded-xl flex justify-between items-start gap-3 backdrop-blur-md">
                                <div className="flex gap-2">
                                    <span className="text-amber-500 shrink-0 mt-0.5">⚠️</span>
                                    <div>
                                        <p className="text-xs font-semibold text-amber-200 uppercase tracking-wider">Eslatma / Ogohlantirish</p>
                                        <p className="text-sm text-stone-300/90 mt-1">{xatoXabari}</p>
                                    </div>
                                </div>
                                <button onClick={() => setXatoXabari('')} className="text-amber-500/50 hover:text-amber-300 transition-colors p-1">
                                    ✕
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Asosiy ishchi hudud */}
                    <main className="max-w-7xl mx-auto w-full px-4 py-8 flex-1 flex flex-col justify-between">
                        
                        {!boshlangan ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center max-w-4xl mx-auto my-8 relative">
                                <div className="absolute inset-0 bg-gradient-to-r from-purple-900/5 to-amber-900/5 rounded-3xl blur-3xl -z-10" />
                                
                                {/* Sham alangasini bezash */}
                                <div className="mb-8 relative flex flex-col items-center justify-end h-32 w-20">
                                    <div className="w-8 h-20 bg-gradient-to-t from-[#2d1b0d] via-[#a3683a] to-[#d9a05b] rounded-md relative shadow-2xl border-t border-amber-300/30">
                                        <div className="absolute top-2 left-1 w-1.5 h-6 bg-[#d9a05b] rounded-full opacity-80" />
                                        <div className="absolute top-4 right-1.5 w-1 h-8 bg-[#d9a05b] rounded-full opacity-70" />
                                        <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full w-0.5 h-5 bg-stone-900" />
                                    </div>
                                    <div className="absolute bottom-[80px] w-6 h-10 bg-gradient-to-t from-orange-600 via-amber-400 to-yellow-100 rounded-full animate-flicker filter blur-[1px] transform origin-bottom flex items-center justify-center shadow-[0_0_20px_rgba(245,158,11,0.8)]">
                                        <div className="w-2.5 h-5 bg-yellow-200 rounded-full opacity-70 animate-ping" />
                                    </div>
                                    <p className="text-[10px] text-amber-500/50 tracking-widest mt-3 font-semibold">ILHOM SHAMI</p>
                                </div>

                                <h2 className="text-4xl md:text-6xl font-black mb-6 tracking-wide leading-tight">
                                    Muammongizga <br />
                                    <span className="bg-gradient-to-r from-amber-400 via-yellow-100 to-amber-500 bg-clip-text text-transparent">
                                        Tarixdan Ilhomlangan
                                    </span> Yechimlar
                                </h2>

                                <p className="text-base md:text-lg text-stone-400 mb-8 max-w-2xl leading-relaxed font-light">
                                    Hayotingizdagi chigal vaziyatlarni yozing. Tarixiy siymolar va olimlar uslubidagi AI sizga ham dono, ham qiziqarli va foydali maslahat beradi.
                                </p>

                                <button
                                    onClick={() => setBoshlangan(true)}
                                    className="group relative px-10 py-5 bg-gradient-to-r from-amber-600 to-amber-500 rounded-full text-black font-bold text-lg tracking-wider hover:from-amber-500 hover:to-yellow-400 transition-all duration-300 shadow-[0_0_30px_rgba(217,119,6,0.35)] active:scale-95 flex items-center gap-3 overflow-hidden"
                                >
                                    <span>🚀 SUHBATNI BOSHLASH</span>
                                    <span>➔</span>
                                </button>

                                {/* Kun Hikmati banneri */}
                                <div className="mt-14 w-full max-w-xl p-6 rounded-2xl border border-amber-900/30 bg-amber-950/10 backdrop-blur-md relative overflow-hidden group hover:border-amber-500/30 transition-all duration-300">
                                    <div className="absolute -top-10 -right-10 w-24 h-24 bg-amber-500/5 rounded-full blur-xl pointer-events-none" />
                                    <div className="flex items-center gap-2 text-amber-400 text-xs tracking-wider uppercase mb-3 font-semibold">
                                        <span>📖 KUN HIKMATI</span>
                                    </div>
                                    <p className="italic text-stone-300 text-base mb-3 font-serif leading-relaxed">
                                        "{kunDonoligi.matn}"
                                    </p>
                                    <p className="text-amber-500/80 text-xs text-right font-medium">
                                        — {kunDonoligi.muallif}
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 my-4">
                                
                                {/* Chap Tomon: Sozlamalar va Muammo kiritish */}
                                <div className="lg:col-span-5 space-y-6">
                                    
                                    {/* Muammo Matn maydoni */}
                                    <div className="p-6 rounded-2xl border border-amber-900/20 bg-[#100d1f]/40 backdrop-blur-lg shadow-xl relative">
                                        <div className="absolute top-4 right-4 flex items-center gap-1.5 px-2 py-1 rounded bg-amber-500/10 border border-amber-500/20 text-[10px] text-amber-400 uppercase font-bold">
                                            <span>🔥 Dono Yondashuv</span>
                                        </div>
                                        <h3 className="text-base font-bold text-amber-400 mb-3 tracking-wide flex items-center gap-2">
                                            <span>✍️</span> MUAMMONGIZNI TUSHUNTIRING
                                        </h3>
                                        <textarea
                                            value={muammo}
                                            onChange={(e) => setMuammo(e.target.value)}
                                            placeholder="Masalan: Imtihondan yiqildim, tushkunlikdaman... yoki Pulim yo'q, nima qilsam bo'ladi?..."
                                            className="w-full h-32 p-4 bg-stone-950/70 border border-stone-800 rounded-xl focus:border-amber-500/50 focus:outline-none focus:ring-1 focus:ring-amber-500/30 text-stone-200 placeholder-stone-600 text-sm resize-none transition-all"
                                        />
                                    </div>

                                    {/* */}
                                    {/* Personajlar ro'yxati */}
                                    <div className="p-6 rounded-2xl border border-amber-900/20 bg-[#100d1f]/40 backdrop-blur-lg shadow-xl">
                                        <h3 className="text-base font-bold text-amber-400 mb-3 tracking-wide flex items-center gap-2">
                                            <span>🎭</span> DONISHMAND USLUBINI TANLANG
                                        </h3>
                                        <div className="grid grid-cols-2 gap-3 max-h-72 overflow-y-auto pr-1 custom-scrollbar">
                                            {PERSONAJLAR.map((p) => (
                                                <button
                                                    key={p.id}
                                                    onClick={() => setTanlanganPersonaj(p)}
                                                    className={`p-3 rounded-xl border text-left transition-all duration-300 group relative overflow-hidden ${
                                                        tanlanganPersonaj.id === p.id 
                                                            ? 'border-amber-500 bg-amber-950/30 text-white shadow-[0_0_15px_rgba(245,158,11,0.15)]' 
                                                            : 'border-stone-800/60 bg-stone-950/40 hover:border-stone-700 hover:bg-stone-950/70 text-stone-400'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-lg">{p.belgi}</span>
                                                        <span className="font-bold text-xs tracking-wider">{p.nom}</span>
                                                    </div>
                                                    <p className="text-[10px] text-stone-500 group-hover:text-stone-300 transition-colors line-clamp-2 leading-relaxed">
                                                        {p.tavsif}
                                                    </p>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Kayfiyat va Rejimlar */}
                                    <div className="p-6 rounded-2xl border border-amber-900/20 bg-[#100d1f]/40 backdrop-blur-lg shadow-xl space-y-5">
                                        <div>
                                            <h3 className="text-xs font-bold text-amber-400/90 uppercase tracking-widest mb-3">
                                                🙂 MASLAHAT KAYFIYATI
                                            </h3>
                                            <div className="flex flex-wrap gap-2">
                                                {KAYFIYATLAR.map((k) => (
                                                    <button
                                                        key={k.id}
                                                        onClick={() => setTanlanganKayfiyat(k)}
                                                        className={`px-3 py-1.5 rounded-full border text-xs font-medium transition-all duration-200 ${
                                                            tanlanganKayfiyat.id === k.id 
                                                                ? `${k.rang} border-amber-500 text-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.15)]` 
                                                                : 'border-stone-850 text-stone-500 hover:text-stone-300 hover:border-stone-700 bg-stone-950/20'
                                                        }`}
                                                    >
                                                        {k.nom}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xs font-bold text-amber-400/90 uppercase tracking-widest mb-3">
                                                📜 QO'SHIMCHA REJIM
                                            </h3>
                                            <div className="flex flex-wrap gap-2">
                                                {REJIMLAR.map((r) => (
                                                    <button
                                                        key={r.id}
                                                        onClick={() => setTanlanganRejim(r)}
                                                        className={`px-3 py-1.5 rounded-lg border text-xs transition-all duration-200 ${
                                                            tanlanganRejim.id === r.id 
                                                                ? 'border-amber-500 bg-amber-500/10 text-amber-300' 
                                                                : 'border-stone-850 text-stone-500 hover:text-stone-300 hover:border-stone-700 bg-stone-950/20'
                                                        }`}
                                                    >
                                                        {r.nom}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Yuborish Tugmasi */}
                                    <button
                                        onClick={donishmanddanSora}
                                        disabled={yuklanmoqda}
                                        className="w-full py-4 bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-700 rounded-xl text-black font-bold text-sm tracking-widest shadow-[0_4px_25px_rgba(217,119,6,0.3)] hover:scale-[1.01] active:scale-95 transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-3"
                                    >
                                        {yuklanmoqda ? (
                                            <>
                                                <span className="w-5 h-5 rounded-full border-2 border-black border-t-transparent animate-spin"></span>
                                                <span>DONISHMAND JAVOB TAYYORLAMOQDA...</span>
                                            </>
                                        ) : (
                                            <>
                                                <span>✨ DONISHMANDDAN JAVOB OLISH</span>
                                            </>
                                        )}
                                    </button>

                                </div>

                                {/* */}
                                {/* O'ng Tomon: Javob va Natija ko'rsatish */}
                                <div className="lg:col-span-7 space-y-6 flex flex-col justify-between" id="print-area">
                                    
                                    <div className="flex-1 min-h-[400px] p-6 md:p-8 rounded-3xl border border-amber-500/20 bg-gradient-to-br from-[#120e24] via-[#090712] to-[#040306] shadow-2xl relative overflow-hidden flex flex-col justify-between">
                                        
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-yellow-200 to-amber-600" />
                                        
                                        {/* Tanlangan personaj sarlavhasi va ovoz paneli */}
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-amber-900/20 pb-4 mb-6 gap-4">
                                            <div className="flex items-center gap-3">
                                                <span className="text-3xl filter drop-shadow-[0_0_8px_rgba(245,158,11,0.6)]">
                                                    {tanlanganPersonaj.belgi}
                                                </span>
                                                <div>
                                                    <h4 className="font-bold text-lg text-amber-400 tracking-wider">
                                                        {tanlanganPersonaj.nom}
                                                    </h4>
                                                    <p className="text-[10px] text-amber-500/60 uppercase tracking-widest flex items-center gap-1.5 font-bold">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" />
                                                        {tanlanganKayfiyat.nom} / {tanlanganRejim.nom}
                                                    </p>
                                                </div>
                                            </div>
                                            
                                            {/* Ovoz berish pulti */}
                                            {javob && (
                                                <div className="flex items-center gap-1 bg-stone-950/80 p-1.5 rounded-xl border border-stone-850">
                                                    <button
                                                        onClick={() => boshqarOvoz('tinglash')}
                                                        className={`p-2 rounded-lg hover:bg-stone-900 transition-colors ${ovozOynalmoqda ? 'text-amber-400 animate-pulse bg-amber-500/10' : 'text-stone-400'}`}
                                                        title="Tinglash"
                                                    >
                                                        ▶
                                                    </button>
                                                    <button
                                                        onClick={() => boshqarOvoz('toxtatish')}
                                                        className="p-2 rounded-lg text-stone-400 hover:text-white hover:bg-stone-900 transition-colors"
                                                        title="To'xtatish"
                                                    >
                                                        ⏸
                                                    </button>
                                                    <button
                                                        onClick={() => boshqarOvoz('ochirish')}
                                                        className="p-2 rounded-lg text-stone-400 hover:text-red-400 hover:bg-stone-900 transition-colors"
                                                        title="To'xtatish va O'chirish"
                                                    >
                                                        ✕
                                                    </button>
                                                    <div className="text-[10px] text-stone-500 px-2 border-l border-stone-850 flex items-center gap-1">
                                                        <span>Tezlik:</span>
                                                        <select
                                                            value={ovozTezligi}
                                                            onChange={(e) => {
                                                                setOvozTezligi(Number(e.target.value));
                                                                boshqarOvoz('ochirish');
                                                            }}
                                                            className="bg-transparent text-amber-400 font-bold focus:outline-none cursor-pointer"
                                                        >
                                                            <option value={0.8} className="bg-stone-950 text-stone-200">0.8x</option>
                                                            <option value={1.0} className="bg-stone-950 text-stone-200">1.0x</option>
                                                            <option value={1.2} className="bg-stone-950 text-stone-200">1.2x</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Pergament qog'oz uslubidagi AI javobi */}
                                        <div className="flex-1 flex flex-col justify-center my-6">
                                            {!javob && !yuklanmoqda ? (
                                                <div className="text-center py-12 space-y-4">
                                                    <p className="text-stone-500 text-sm italic">
                                                        Muammongizni chap tomonga yozing va dono maslahat oling...
                                                    </p>
                                                </div>
                                            ) : yuklanmoqda ? (
                                                <div className="space-y-4 py-12 text-center">
                                                    <div className="flex justify-center gap-1.5">
                                                        <span className="w-3 h-3 rounded-full bg-amber-500 animate-bounce" />
                                                        <span className="w-3 h-3 rounded-full bg-amber-400 animate-bounce" style={{ animationDelay: '150ms' }} />
                                                        <span className="w-3 h-3 rounded-full bg-amber-600 animate-bounce" style={{ animationDelay: '300ms' }} />
                                                    </div>
                                                    <p className="text-stone-400 text-sm italic tracking-wider">
                                                        Tarix varaqlari titilmoqda, dono javob tayyorlanmoqda...
                                                    </p>
                                                </div>
                                            ) : (
                                                <div className="relative p-6 rounded-2xl border border-amber-500/10 bg-amber-950/5">
                                                    <div className="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-amber-500/20 rounded-tl-lg" />
                                                    <div className="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-amber-500/20 rounded-br-lg" />
                                                    <p className="text-lg md:text-xl text-stone-200 font-serif leading-relaxed italic pr-4 whitespace-pre-line">
                                                        "{jonliMatn}"
                                                    </p>
                                                </div>
                                            )}
                                        </div>

                                        {/* Amallar (Nusxalash, Chop etish, Ulashish) */}
                                        {javob && (
                                            <div className="border-t border-amber-900/20 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                                                <div className="flex flex-wrap gap-2">
                                                    <button
                                                        onClick={nusxaOlish}
                                                        className="px-4 py-2 bg-stone-900 hover:bg-stone-850 text-stone-300 border border-stone-800 rounded-lg text-xs font-medium flex items-center gap-2 transition-all active:scale-95"
                                                    >
                                                        <span>{nusxalandi ? "✓ Nusxalandi!" : "📋 Nusxalash"}</span>
                                                    </button>
                                                    <button
                                                        onClick={yuklashPDF}
                                                        className="px-4 py-2 bg-stone-900 hover:bg-stone-850 text-stone-300 border border-stone-800 rounded-lg text-xs font-medium flex items-center gap-2 transition-all active:scale-95"
                                                    >
                                                        <span>📄 PDF / Chop etish</span>
                                                    </button>
                                                    <button
                                                        onClick={() => {
                                                            if (navigator.share) {
                                                                navigator.share({
                                                                    title: "Donishmand AI Maslahati",
                                                                    text: javob,
                                                                    url: window.location.href,
                                                                }).catch(console.error);
                                                            } else {
                                                                nusxaOlish();
                                                            }
                                                        }}
                                                        className="px-4 py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 rounded-lg text-xs font-medium flex items-center gap-2 transition-all active:scale-95"
                                                    >
                                                        <span>📤 Ulashish</span>
                                                    </button>
                                                </div>
                                                <div className="flex items-center gap-2 text-[10px] text-stone-500 max-w-xs text-right md:text-left leading-tight">
                                                    <span>⚠️ Javoblar tarixiy shaxslardan ilhomlangan badiiy va ko'ngilochar maslahatlardir.</span>
                                                </div>
                                            </div>
                                        )}

                                    </div>

                                    {/* */}
                                    {/* Doiraviy o'lchov datchiklari */}
                                    {javob && (
                                        <div className="p-6 rounded-2xl border border-amber-900/20 bg-[#100d1f]/40 backdrop-blur-lg shadow-xl">
                                            <h4 className="text-xs font-bold text-amber-400 mb-6 uppercase tracking-wider flex items-center gap-2">
                                                <span>🏆</span> HAYOTIY TAVSIYALAR BAHOSI
                                            </h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
                                                {[
                                                    { nom: "Jasorat", qiymat: baholar.jasorat, rang: "stroke-amber-500" },
                                                    { nom: "Intizom", qiymat: baholar.intizom, rang: "stroke-yellow-500" },
                                                    { nom: "Rivojlanish", qiymat: baholar.rivojlanish, rang: "stroke-emerald-500" },
                                                    { nom: "Ruhiyat", qiymat: baholar.ruhiyat, rang: "stroke-purple-500" },
                                                    { nom: "Umid", qiymat: baholar.umid, rang: "stroke-blue-500" }
                                                ].map((g, idx) => (
                                                    <div key={idx} className="flex flex-col items-center space-y-2">
                                                        <div className="relative w-16 h-16 flex items-center justify-center">
                                                            <svg className="w-full h-full transform -rotate-90">
                                                                <circle cx="32" cy="32" r="28" stroke="currentColor" className="text-stone-850" strokeWidth="4" fill="transparent" />
                                                                <circle cx="32" cy="32" r="28" stroke="currentColor" className={`${g.rang} transition-all duration-1000`} strokeWidth="4" fill="transparent"
                                                                    strokeDasharray={2 * Math.PI * 28}
                                                                    strokeDashoffset={2 * Math.PI * 28 * (1 - g.qiymat / 100)}
                                                                />
                                                            </svg>
                                                            <span className="absolute text-[11px] font-bold text-white">{g.qiymat}%</span>
                                                        </div>
                                                        <span className="text-xs text-stone-400">{g.nom}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                </div>

                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto w-full px-4 py-6 text-center text-xs text-stone-600 border-t border-amber-900/10">
                        <p>© 2026 Donishmand AI. Barcha huquqlar himoyalangan. Buyuk madaniy merosga hurmat ila.</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
